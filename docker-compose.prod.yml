services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: loto-backend:latest
    container_name: loto-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8080
    ports:
      - "80:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - loto-network

  postgres:
    image: postgres:16-alpine
    container_name: loto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-loto}
      POSTGRES_USER: ${DB_USERNAME:-loto}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-loto_secret_2024}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-loto} -d ${DB_DATABASE:-loto}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - loto-network

  redis:
    image: redis:7-alpine
    container_name: loto-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-loto_redis}
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - loto-network

networks:
  loto-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
